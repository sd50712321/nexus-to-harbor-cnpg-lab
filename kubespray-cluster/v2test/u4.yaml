apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: u4, namespace: v2test}
spec: {accessModes: [ReadWriteOnce], storageClassName: pgtest-v2, resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: u4, namespace: v2test}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: u4}}
  template:
    metadata: {labels: {app: u4}}
    spec:
      terminationGracePeriodSeconds: 5
      securityContext: {runAsUser: 0}
      containers:
      - name: w
        image: ghcr.io/cloudnative-pg/postgresql:16.15-minimal-bookworm
        command: ["bash","-c","while true; do dd if=/dev/zero of=/data/load.bin bs=1M count=64 oflag=direct 2>/dev/null || sleep 1; done"]
        volumeMounts: [{name: d, mountPath: /data}]
      volumes: [{name: d, persistentVolumeClaim: {claimName: u4}}]
