# Longhorn 볼륨 성능: fio 다섯 가지를 차례로 돌린다.
#   SC=longhorn-v2 NODE=ks-w2 SIZE=2G RUNTIME=20 envsubst < perf/fio.yaml | kubectl apply -f -
#   kubectl -n perf logs -f job/fio-$SC
# 랩은 alpine 에 fio 를 그때 설치한다(프록시 경유). 폐쇄망에서는 fio 가 들어 있는 이미지를 내부 저장소에 올려 image 를 바꾸고 apk 줄을 지운다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: fio-${SC}, namespace: perf}
spec:
  storageClassName: ${SC}
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 3Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: fio-${SC}, namespace: perf}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: ${NODE}}      # nodeName 을 쓰면 스케줄러를 건너뛰어 WaitForFirstConsumer PVC 가 묶이지 않는다
      containers:
      - name: fio
        image: alpine:3.20
        env:
        - {name: http_proxy, value: "${PROXY}"}
        - {name: https_proxy, value: "${PROXY}"}
        command: ["sh","-c"]
        args:
        - |
          apk add -q fio >/dev/null 2>&1 || { echo "fio 설치 실패"; exit 1; }
          F=/volume/test; C="--filename=$F --size=${SIZE} --runtime=${RUNTIME} --time_based --group_reporting"
          fio --name=prefill --filename=$F --size=${SIZE} --rw=write --bs=1M --direct=1 --ioengine=libaio --iodepth=16 >/dev/null
          run(){ n=$1; shift; echo "== $n"; fio --name=$n $C "$@" | grep -E "IOPS=|clat \(|sync \(|99.00th" | grep -vE "^ +slat" | cut -c1-110; }
          run randread-4k   --direct=1 --ioengine=libaio --rw=randread  --bs=4k --iodepth=32 --numjobs=2
          run randwrite-4k  --direct=1 --ioengine=libaio --rw=randwrite --bs=4k --iodepth=32 --numjobs=2
          run seqread-1m    --direct=1 --ioengine=libaio --rw=read      --bs=1M --iodepth=16
          run seqwrite-1m   --direct=1 --ioengine=libaio --rw=write     --bs=1M --iodepth=16
          run fsync-8k      --ioengine=sync --rw=write --bs=8k --fdatasync=1
        volumeMounts: [{name: vol, mountPath: /volume/}]
      volumes: [{name: vol, persistentVolumeClaim: {claimName: fio-${SC}}}]
